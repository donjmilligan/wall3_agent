# The authoritative gate list. CLAUDE.md summarises it; this file is what runs.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"

jobs:
  root:
    name: root (hooks, scripts, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  packages:
    name: package (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [clients/clickup, clients/slack, tools/messaging]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: package exists
        run: test -f pyproject.toml || { echo "::error::${{ matrix.package }}/pyproject.toml missing"; exit 1; }
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  integration:
    name: integration (doc refs, message contract)
    needs: [root, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/check_harness_refs.py
      - run: uv run python scripts/check_message_contract.py
