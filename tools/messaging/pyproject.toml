[project]
name = "wall3-messaging"
version = "0.1.0"
description = "Deterministic inbox ranking and reply-draft linting for the wall3 agent harness."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
inbox-rank = "wall3_messaging.rank:main"
check-draft = "wall3_messaging.check_draft:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wall3_messaging"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "pyright>=1.1.380"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
