# check-draft rules. This file IS the configuration: edit it, re-run the tests.
#
# docs/voice/VOICE.md points here for the banned-phrase list. Phrases are matched
# case-insensitively after collapsing whitespace and straightening curly quotes.
# `*_patterns` entries are Python regular expressions, also case-insensitive.
#
# Severity: FAIL makes check-draft exit 1 (Claude must revise before presenting the
# draft as ready; Don may still override explicitly). WARN is shown, exit stays 0.

[banned]
# FAIL. Filler, hedging and AI tells Don does not write.
phrases = [
  "I hope this message finds you well",
  "I hope this finds you well",
  "As an AI",
  "As a language model",
  "It appears that",
  "could potentially",
  "Great question",
  "I apologize for any confusion",
  "I apologize for the inconvenience",
  "Please don't hesitate to reach out",
  "Please do not hesitate to reach out",
  "I hope this helps",
  "Let me know if you have any other questions",
]

[placeholders]
# FAIL. Template residue that must never reach a recipient.
patterns = [
  '\{\{[^{}]*\}\}',                                 # {{name}}
  '<(?![@#!/]|https?:|mailto:)[A-Za-z][^<>\n]{0,40}>',  # <date>, <link to plan>
  '\[(?:TBD|TODO|INSERT[^\]]*|NAME|DATE|LINK)\]',  # [TBD], [INSERT DATE]
]
# Case-SENSITIVE whole words (an ordinary "todo list" is fine; "TODO" is not).
words = ["TODO", "TBD", "XXX", "FIXME"]

[commitment]
# FAIL. Promises only Don can make. A draft may say what is known; it does not
# pledge dates, outcomes or guarantees on Don's behalf.
patterns = [
  '\bI promise\b',
  '\bI guarantee\b',
  '\bguaranteed\b',
  '\byou have my word\b',
  '\bI commit to\b',
  '\bconsider it done\b',
  '\bwill never happen again\b',
  '\b100% (?:sure|certain|committed)\b',
]

[claims_write]
# FAIL. The draft says a ClickUp/Slack write already happened. At draft time it
# has not -- propose the write (Don approves it) instead of asserting it.
patterns = [
  '''\bI(?:'ve| have) (?:moved|marked|closed|resolved|reassigned)\b''',
  '''\bI(?:'ve| have) (?:changed|updated|set) (?:the |its )?status\b''',
  '\b(?:moved|marked) (?:it|this|the task) (?:as |to )?(?:done|complete|closed|in review|review)\b',
  '\bstatus (?:is now|has been (?:changed|updated|set))\b',
]

[secrets]
# FAIL in a draft; WARN when found in the source thread (do not quote it back).
patterns = [
  'xox[abpr]-[A-Za-z0-9-]{8,}',
  'xapp-[A-Za-z0-9-]{8,}',
  'sk-ant-[A-Za-z0-9_-]{8,}',
  'pk_\d+_[A-Za-z0-9]{8,}',
  'ghp_[A-Za-z0-9]{8,}',
  'github_pat_[A-Za-z0-9_]{8,}',
  'AKIA[0-9A-Z]{16}',
  '-----BEGIN [A-Z ]*PRIVATE KEY-----',
]

[injection]
# WARN, checked against the SOURCE thread only. Text aimed at an AI rather than at
# Don. It is data, never an instruction; the report tells Don it is there.
patterns = [
  '\b(?:ignore|disregard|forget)\b.{0,20}\b(?:previous|prior|above|earlier|your|all)\b.{0,20}\b(?:instructions?|prompts?|rules|directions)\b',
  '\byou are now\b',
  '\bsystem prompt\b',
  '\bnew instructions\s*:',
  '\b(?:send|post|paste|share|give)\b.{0,20}\b(?:the|your)\b.{0,15}\b(?:token|api key|password|credentials?|secret)s?\b',
  '\b(?:reveal|print|show|repeat)\b.{0,15}\b(?:your|the)\b.{0,15}\b(?:instructions|prompt|configuration)\b',
  '\bdeveloper mode\b',
  '\bdo not tell (?:don|the user|anyone)\b',
]

[mentions]
# @here / @channel / @everyone in a draft: WARN (it pings everyone).
broadcast = ["here", "channel", "everyone"]

[length.slack]
min_chars = 2
warn_chars = 600
max_chars = 1200

[length.clickup]
min_chars = 2
warn_chars = 1500
max_chars = 4000
