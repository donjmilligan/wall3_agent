[project]
name = "wall3-clickup"
version = "0.1.0"
description = "ClickUp REST client and CLI for the wall3 agent harness: read inbox/tasks/chat, draft-safe writes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
# `main(argv) -> int`; the generated console script calls sys.exit(main()),
# so the returned int is the process exit code (0 ok, 1 error, 3 refused).
clickup = "wall3_clickup.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wall3_clickup"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_env_search: let the test use the real .env candidate search (git worktree tests)",
]
