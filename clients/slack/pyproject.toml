[project]
name = "wall3-slack"
version = "0.1.0"
description = "Slack Web API client and CLI for triaging and drafting replies as the workspace owner (user token)."
readme = "README.md"
# Upper bound on purpose: with a bare `>=` the venv floats to whatever
# interpreter is newest on the machine.
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
slack = "wall3_slack.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wall3_slack"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
